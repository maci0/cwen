<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cwen logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101d33"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".55" stop-color="#9a6bff"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#c3d0e8"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="1.5" y="1.5" width="637" height="197" rx="18" fill="url(#bg)" stroke="#26364f" stroke-width="1"/>

  <!-- chip: memory-bandwidth motif -->
  <g transform="translate(52,44)">
    <rect x="0" y="0" width="112" height="112" rx="16" fill="#131f36" stroke="#2c405f"/>
    <!-- pins -->
    <g stroke="#3b557d" stroke-width="4" stroke-linecap="round">
      <line x1="-14" y1="22" x2="0"  y2="22"/><line x1="-14" y1="56" x2="0"  y2="56"/><line x1="-14" y1="90" x2="0"  y2="90"/>
      <line x1="112" y1="22" x2="126" y2="22"/><line x1="112" y1="56" x2="126" y2="56"/><line x1="112" y1="90" x2="126" y2="90"/>
      <line x1="22" y1="-14" x2="22" y2="0"/><line x1="56" y1="-14" x2="56" y2="0"/><line x1="90" y1="-14" x2="90" y2="0"/>
      <line x1="22" y1="112" x2="22" y2="126"/><line x1="56" y1="112" x2="56" y2="126"/><line x1="90" y1="112" x2="90" y2="126"/>
    </g>
    <!-- decode waveform: dense block sweep -->
    <polyline points="12,74 24,74 24,50 36,50 36,66 48,66 48,38 60,38 60,58 72,58 72,30 84,30 84,62 100,62"
              fill="none" stroke="url(#wave)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- speculative draft ticks ahead of the sweep head -->
    <g fill="none" stroke-linecap="round">
      <path d="M100,62 L100,54" stroke="#9a6bff" stroke-width="4" opacity=".85"/>
      <path d="M100,46 L100,42" stroke="#ff7a59" stroke-width="4" opacity=".65"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="204" y="118" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace"
        font-size="76" font-weight="700" letter-spacing="2" fill="url(#txt)">cwen</text>

  <!-- tagline -->
  <text x="206" y="156" font-family="'SF Mono',Menlo,Consolas,monospace"
        font-size="17" letter-spacing="1.4" fill="#7f92b5">pure-C Qwen inference · AVX-512 · DFlash2</text>
</svg>
