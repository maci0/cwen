[tool.ruff]
# tools/ scripts only; run.c is checked by the C toolchain (see `make lint`).
line-length = 100
# Track .python-version (3.13): ruff gates upgrades to newer syntax.
target-version = "py313"
# ref/SCRATCH/outputs are scratch + artifact areas by design; .venv is env.
extend-exclude = [".venv", "ref", "SCRATCH", "outputs"]

[tool.ruff.lint]
# Baseline: pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify,
# comprehensions, builtins-shadowing (A), naive-datetime (DTZ), debugger
# leftovers (T10), private-access (SLF), modernization (FURB) plus the clean
# groups TID (import order/style), INP (stray namespace packages), YTT
# (sys.version typing traps), FLY (f-string joins).
# Extend in later passes (PL, RUF, BLE, ARG, RET, PERF, FBT) once their
# current findings are cleared; RUF100 (stale-noqa guard) is pulled forward
# ahead of its group because it polices suppression hygiene itself. SIM115
# stays selected: its single hit (gguf_util.GGUF.open keeps the fd alive under
# an mmap by design) carries a scoped noqa at the site instead of a global
# ignore here.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "A", "DTZ", "T10", "SLF", "FURB", "TID", "INP", "YTT", "FLY", "RUF100"]

[tool.ruff.lint.isort]
# In-tree modules imported as libraries by other tools (not just run as
# scripts): spec_check imports bench_toks and spec_e2e; spec_sweep imports
# spec_e2e; e2e_ref/gen_golden/repack_q4 import gguf_util/ref_kernels.
known-first-party = ["bench_toks", "gguf_util", "ref_kernels", "spec_e2e"]

[tool.mypy]
# Wired into `make lint` (mypy itself is a system package like shellcheck/cppcheck).
# python_executable pins import resolution to the project venv, so types come
# from the same hash-checked lock that make setup installs (not from whichever
# packages the system interpreter happens to have).
python_executable = ".venv/bin/python"
# Ratcheted: check_untyped_defs, extra_checks, strict_equality,
# disallow_untyped_decorators, disallow_subclassing_any,
# disallow_untyped_globals, local_partial_types all pass clean
# (re-verified 2026-08-24 against mypy 2.1).
# strict = true remains blocked by the no-untyped-def family: 66 errors in
# 14 files under --strict as of mypy 2.1 (2026-08-24); clear via later passes.
# Also still failing standalone: warn_return_any (6), disallow_incomplete_defs
# (9), disallow_any_generics (11), disallow_untyped_calls (37);
# possibly-undefined error code (1). Counts re-measured 2026-08-24.
# python_version must track .python-version: numpy's stubs use `type`
# statements, which abort mypy when it targets anything below 3.12.
python_version = "3.13"
files = ["tools"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_reexport = true
warn_unused_configs = true
check_untyped_defs = true
extra_checks = true
strict_equality = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
disallow_untyped_globals = true
local_partial_types = true
# Opt-in error codes, all clean as of 2026-08-24: ignore-without-code forces
# every `# type: ignore` to name its rule (the mypy analog of a scoped noqa);
# truthy-bool/redundant-expr catch silent logic slips. possibly-undefined
# still has one finding; enable it in a later pass.
enable_error_code = ["ignore-without-code", "truthy-bool", "redundant-expr"]
