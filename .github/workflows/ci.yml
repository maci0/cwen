name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: sudo apt-get update && sudo apt-get install -y cppcheck shellcheck

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: python deps (tools)
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: build (AVX2)
        run: make

      - name: lint (cppcheck + shellcheck + ruff)
        run: make lint

      - name: smoke (help + usage paths)
        run: |
          ./run --help > /dev/null
          ./bench_q4_gemv --help > /dev/null || true
