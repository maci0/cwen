name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-24.04
    steps:
      # Pinned by SHA for supply-chain integrity; bump deliberately via the
      # tag comment (fetch the commit SHA the tag points at before moving it).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: toolchain
        run: sudo apt-get update && sudo apt-get install -y cppcheck shellcheck

      - name: install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # Pinned like mypy below: without this the action floats to latest,
          # letting CI resolve requirements.lock with a different resolver than
          # contributor machines. Bump together with local `uv --version`.
          version: "0.12.3"
          # No python-version here on purpose: uv discovers .python-version
          # (3.13) from the checkout, keeping that file the single source of
          # truth for the interpreter instead of a second literal in CI YAML.

      # Needs uv on PATH from the step above. Pinned to the version local dev
      # documents its mypy ratchet against (pyproject.toml); a floating latest
      # here would let CI and contributor machines disagree on the gate.
      - name: install uv tool (mypy)
        run: uv tool install mypy==2.1.0

      # Same entry point as local dev: hash-checked requirements.lock, so CI
      # cannot drift from what contributors install via `make setup`.
      - name: python deps (tools)
        run: make setup

      # Compile only, and first so the AVX2 build below is what later steps
      # run: the runner may lack AVX-512, but the branches behind
      # -DCWEN_AVX512 still have to typecheck. Two of them (dot_q8s,
      # dot_q8si) sat broken for a release because nothing built this
      # config, and an unaligned-load fault behind -flto shipped the same way.
      - name: build (AVX-512, compile only)
        run: make AVX512=1

      - name: build (AVX2)
        run: make

      # Record the exact toolchain + flags in the job log for faithful rebuilds.
      - name: buildinfo
        run: make buildinfo

      - name: lint (cppcheck + shellcheck + ruff)
        run: make lint

      - name: smoke (help + usage paths)
        run: |
          # The two bench binaries are not part of the default build; build
          # them here so their --help paths are exercised as intended.
          make bench-q4_gemv bench-spec
          ./run --help > /dev/null
          ./bench_q4_gemv --help > /dev/null
          ./bench_spec --help > /dev/null

      # Same source must yield a bit-identical binary from a second build tree
      # under a different path, locale, TZ, and SOURCE_DATE_EPOCH.
      - name: reproducible-build check
        run: tools/check_reproducible.sh
